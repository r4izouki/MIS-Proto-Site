<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIP - Internship Finder</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="site">

        <div class="top-header">          
            <div class="logo-area">
                <div class="logo">
					<img src="siplogo.png" alt="SIP Logo" style="height: 60px;">
                </div>
            </div>

            <div class="site-title-area">
                <h1>Internship Finder</h1>
            </div>

            <div class="university-area">
                <div class="uni-name">Prince Mohammad Bin Fahd University</div>
                <div class="uni-tagline">Educate, Inspire, Transform the World</div>
            </div>
        </div>

        <nav>
            <a href="index.html" class="active">Home</a>
            <a href="about.html">About Us</a>
            <a href="companies.html">List of Companies</a>
            <a href="account.html">Account</a>
            <input type="text" class="nav-search" placeholder="Search">
        </nav>

        <div class="main-content">

            <div class="home-layout">


                <div class="home-left">
                    <div class="hero-image-box">
                        <div class="hero-image-inner">
                            <img src="internship-resume.jpg" alt="Internship Image" style="height: 300px;">
                        </div>
                    </div>
                </div>

                
                <div style="display:table-cell; vertical-align:middle; width:28px; text-align:center;">
                    <span class="carousel-arrow">&#8250;</span>
                </div>

                
                <div class="home-divider"></div>

                
                <div class="home-right">
                    <input type="text"     class="field-input" placeholder="User Name">
                    <input type="password" class="field-input" placeholder="Password">
                    <button class="signin-btn">Sign In</button>
                    <div class="no-account">
                        Don't have an account?<br>
                        <a href="signup.html">Create One</a>
                    </div>
                </div>

            </div>
            
        </div>
        

    </div>
    
</div>


</body>
</html>
