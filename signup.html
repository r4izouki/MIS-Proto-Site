<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIP - Sign Up</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

   
    <div class="top-header">
        <div class="logo-area">
            <div class="logo">
                <img src="siplogo.png" alt="SIP Logo" style="height: 60px;">
            </div>
        </div>
        <div class="site-title-area">
            <h1>Internship Finder</h1>
        </div>
        <div class="university-area">
            <div class="uni-name">Prince Mohammad Bin Fahd University</div>
            <div class="uni-tagline">Educate, Inspire, Transform the World</div>
        </div>
    </div>

 
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="companies.html">List of Companies</a>
        <a href="account.html">Account</a>
        <input type="text" class="nav-search" placeholder="Search">
    </nav>

    
    <div class="main-content">

        <div class="signup-layout">

            
            <div class="signup-col">
                <input type="text"  class="su-input" placeholder="First Name">
                <input type="text"  class="su-input" style="margin-top:10px;" placeholder="Last Name">
                <input type="email" class="su-input" style="margin-top:10px;" placeholder="Email">
                <input type="tel"   class="su-input" style="margin-top:10px;" placeholder="Phone #">
                <input type="text"  class="su-input" style="margin-top:10px;" placeholder="Major">
            </div>

            <div class="signup-divider"></div>

        
            <div class="signup-col">
                <span class="su-label">University</span>
                <select class="su-select">
                    <option>PMU - Prince Mohammed University &#8645;</option>
                    <option>KFUPM</option>
                    <option>King Saud University</option>
                    <option>Other</option>
                </select>

                <input type="text" class="su-input" style="margin-top:12px;" placeholder="National ID / Iqama">

                <span class="su-label" style="margin-top:14px;">Date of Birth</span>
                <div class="dob-row">
                    <div class="dob-col">
                        <span class="dob-sub">Day</span>
                        <input type="text" class="dob-input">
                    </div>
                    <div class="dob-col">
                        <span class="dob-sub">Month</span>
                        <input type="text" class="dob-input">
                    </div>
                    <div class="dob-col">
                        <span class="dob-sub">Year</span>
                        <input type="text" class="dob-input">
                    </div>
                </div>
            </div>

            <div class="signup-divider"></div>

          
            <div class="signup-col">
                <input type="text"     class="su-input"                         placeholder="User Name">
                <input type="password" class="su-input" style="margin-top:10px;" placeholder="Password">
                <input type="password" class="su-input" style="margin-top:10px;" placeholder="Confirm Password">
                <button class="signup-btn">Sign Up</button>
            </div>

        </div>

        <div class="timestamp">Thursday 23rd April 2026 &nbsp;14:47</div>

    </div>

</body>
</html>
